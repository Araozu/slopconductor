[package]
name = "slop-runtime"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Native agent execution and scheduling for Slop Conductor"

[dependencies]
reqwest = { workspace = true, features = ["form"] }
serde.workspace = true
serde_json.workspace = true
slop-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "sync", "process", "fs"] }

base64 = "0.23"
getrandom = "0.4"
sha2 = "0.10"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
tempfile = "3"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
cap-std = "4"

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
axum.workspace = true
futures-util.workspace = true
rsa = "0.9"

[lints]
workspace = true
