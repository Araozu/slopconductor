[workspace]
members = ["crates/*"]
default-members = ["crates/slop-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
url = "2.5"
getrandom = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }
subtle = "2.6"
tempfile = "3"
toml = "0.9"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
slop-core = { path = "crates/slop-core" }
slop-protocol = { path = "crates/slop-protocol" }
slop-runtime = { path = "crates/slop-runtime" }
slop-client = { path = "crates/slop-client" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
